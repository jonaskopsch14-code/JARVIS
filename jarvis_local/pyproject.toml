[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "Lokaler Windows-Sprachassistent (Hybrid-Architektur, Permission-Gateway)"
requires-python = ">=3.11"
# Der Kern nutzt nur die Standardbibliothek; Live-Abhängigkeiten stehen in requirements.txt.
dependencies = []

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

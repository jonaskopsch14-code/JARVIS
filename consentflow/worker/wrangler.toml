name = "consentflow-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cloudflare D1 – Datenbank-Binding.
# Nach `wrangler d1 create consentflow` die ausgegebene database_id hier eintragen.
[[d1_databases]]
binding = "DB"
database_name = "consentflow"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Nicht-geheime Variablen. Geheimnisse (JWT_SECRET, STRIPE_*) via
# `wrangler secret put NAME` setzen – NICHT hier eintragen.
[vars]
APP_URL = "https://app.consentflow.de"        # Dashboard-URL (für Stripe-Redirects & CORS)
CONSENT_VERSION = "1"                          # erhöhen, wenn sich Kategorien/Texte rechtlich ändern
STRIPE_PRICE_STARTER = "price_REPLACE_STARTER" # Stripe-Preis-ID Starter (19 €/Monat)
STRIPE_PRICE_AGENCY  = "price_REPLACE_AGENCY"  # Stripe-Preis-ID Agency (49 €/Monat)

# Zu setzende Secrets (Beispiel):
#   wrangler secret put JWT_SECRET
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
